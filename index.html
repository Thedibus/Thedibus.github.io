<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Mesa de Héroes</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body class="popover">
  <div id="aviso-entorno" class="aviso" hidden>
    Abre esta ventana desde <strong>Owlbear Rodeo</strong>: Extensiones → Mesa de Héroes.
  </div>

  <div id="app" class="app" hidden>
    <header class="cabecera">
      <div class="marca">
        <img src="/icon.svg" alt="" class="marca-icono" />
        <div class="marca-texto">
          <h1>Mesa de Héroes</h1>
          <p id="subtitulo">Fichas, PG y tiradas</p>
        </div>
      </div>
      <span id="rol" class="insignia" title="Tu rol en la sala">…</span>
    </header>

    <nav class="pestanas" role="tablist" aria-label="Secciones">
      <button class="pestana es-activa" role="tab" data-panel="pjs" aria-selected="true">PJs</button>
      <button class="pestana" role="tab" data-panel="dados" aria-selected="false">Dados</button>
      <button class="pestana" role="tab" data-panel="token" aria-selected="false">Token</button>
      <button class="pestana" role="tab" data-panel="registro" aria-selected="false">Registro</button>
      <button class="pestana pestana-icono" role="tab" data-panel="ajustes" aria-selected="false" title="Ajustes" aria-label="Ajustes">⚙</button>
    </nav>

    <main class="contenido">
      <section class="panel es-activa" data-panel="pjs" role="tabpanel">
        <div class="barra">
          <button id="btn-nuevo" class="btn primario">+ Nuevo PJ</button>
          <button id="btn-importar" class="btn" title="Importar PJs desde un archivo JSON">Importar</button>
          <button id="btn-exportar" class="btn" title="Descargar todos los PJs en JSON">Exportar</button>
          <input id="input-archivo" type="file" accept="application/json,.json" hidden />
        </div>
        <div id="lista-pjs" class="lista-pjs"></div>
      </section>

      <section class="panel" data-panel="dados" role="tabpanel">
        <div id="panel-dados"></div>
      </section>

      <section class="panel" data-panel="token" role="tabpanel">
        <div id="panel-token"></div>
      </section>

      <section class="panel" data-panel="registro" role="tabpanel">
        <div class="barra">
          <h2 class="titulo-seccion">Últimas tiradas</h2>
          <button id="btn-limpiar-registro" class="btn sutil">Limpiar</button>
        </div>
        <ol id="lista-registro" class="registro"></ol>
      </section>

      <section class="panel" data-panel="ajustes" role="tabpanel">
        <div id="panel-ajustes"></div>
      </section>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="dialogo-pj" class="dialogo" aria-label="Ficha de personaje"></dialog>

  <dialog id="dialogo-confirmar" class="dialogo" aria-label="Confirmar acción">
    <form method="dialog">
      <header class="dialogo-cabecera">
        <h2 id="confirmar-titulo">Confirmar</h2>
      </header>
      <div class="dialogo-cuerpo">
        <p id="confirmar-texto" class="ayuda"></p>
      </div>
      <footer class="dialogo-pie">
        <button class="btn" value="no">Cancelar</button>
        <button class="btn peligro" value="si" id="confirmar-si">Sí, continuar</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
