<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Mesa de Héroes</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/logo/png/icono-256.png" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body class="popover">
  <div id="aviso-entorno" class="aviso" hidden>
    Abre esta ventana desde <strong>Owlbear Rodeo</strong>: Extensiones → Mesa de Héroes.
  </div>

  <div id="app" class="app" hidden>
    <header class="cabecera">
      <div class="marca">
        <img src="/icon.svg" alt="" class="marca-icono" />
        <div class="marca-texto">
          <h1>Mesa de Héroes</h1>
          <p id="subtitulo">Fichas y vida compartida</p>
        </div>
      </div>
      <div class="cabecera-acciones">
        <button id="btn-tamano" class="btn icono" title="Ampliar panel" aria-label="Ampliar panel">⤢</button>
        <span id="rol" class="insignia" title="Tu rol en la sala">…</span>
      </div>
    </header>

    <nav class="pestanas" role="tablist" aria-label="Secciones">
      <button class="pestana es-activa" role="tab" data-panel="ficha" aria-selected="true">Ficha</button>
      <button class="pestana" role="tab" data-panel="pjs" aria-selected="false">PJs</button>
      <button class="pestana pestana-icono" role="tab" data-panel="ajustes" aria-selected="false" title="Ajustes" aria-label="Ajustes">⚙</button>
    </nav>

    <main class="contenido">
      <section class="panel es-activa" data-panel="ficha" role="tabpanel">
        <div id="panel-ficha"></div>
      </section>

      <section class="panel" data-panel="pjs" role="tabpanel">
        <div class="barra">
          <button id="btn-nuevo" class="btn primario">+ Nuevo PJ</button>
          <button id="btn-importar-pj" class="btn" title="Importar un solo personaje desde un archivo JSON">Importar PJ</button>
          <input id="input-pj" type="file" accept="application/json,.json" hidden />
          <input id="input-archivo" type="file" accept="application/json,.json" hidden />
        </div>
        <div id="lista-pjs" class="lista-pjs"></div>
      </section>

      <section class="panel" data-panel="ajustes" role="tabpanel">
        <div id="panel-ajustes"></div>
      </section>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <dialog id="dialogo-pj" class="dialogo" aria-label="Ficha de personaje"></dialog>
  <dialog id="dialogo-ficha" class="dialogo dialogo-ficha" aria-label="Ficha completa"></dialog>

  <dialog id="dialogo-confirmar" class="dialogo" aria-label="Confirmar acción">
    <form method="dialog">
      <header class="dialogo-cabecera">
        <h2 id="confirmar-titulo">Confirmar</h2>
      </header>
      <div class="dialogo-cuerpo">
        <p id="confirmar-texto" class="ayuda"></p>
      </div>
      <footer class="dialogo-pie">
        <button class="btn" value="no">Cancelar</button>
        <button class="btn peligro" value="si" id="confirmar-si">Sí, continuar</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
